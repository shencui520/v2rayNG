name: Build Reverse Home arm64 Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverse-home-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865"

      - name: Build required native libraries
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Determine Xray library version
        run: |
          echo "XRAY_LIB_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Test reverse-home configuration and build arm64 Debug APK
        working-directory: V2rayNG
        run: |
          printf "sdk.dir=%s\\n" "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testFdroidDebugUnitTest --tests com.v2ray.ang.core.HomeNetworkConfigBuilderTest :app:assembleFdroidDebug -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Upload arm64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-reverse-home-arm64-debug
          path: V2rayNG/app/build/outputs/apk/fdroid/debug/*arm64-v8a*.apk
          if-no-files-found: error
