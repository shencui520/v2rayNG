name: Sync upstream and validate Reverse

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 2dust/v2rayNG branch, tag, or commit
        required: true
        default: master
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reverse-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Reverse integration branch
        uses: actions/checkout@v7
        with:
          ref: reverse-next
          submodules: recursive
          fetch-depth: 0

      - name: Merge selected upstream revision
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          workflow_snapshot=$(mktemp -d)
          cp -a .github/workflows/. "$workflow_snapshot/"
          git remote add upstream https://github.com/2dust/v2rayNG.git
          git fetch upstream "$UPSTREAM_REF"
          sync_branch="sync/upstream-${GITHUB_RUN_ID}"
          git switch -c "$sync_branch"
          if ! git merge --no-edit FETCH_HEAD; then
            git diff --name-only --diff-filter=U
            echo "Upstream merge has conflicts; Reverse hooks require adaptation." >&2
            exit 1
          fi
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$workflow_snapshot/." .github/workflows/
          git rev-parse FETCH_HEAD > .reverse/UPSTREAM_BASE
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "SYNC_BRANCH=$sync_branch" >> "$GITHUB_ENV"
          echo "SYNC_BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Assert manual-only workflows
        run: bash scripts/reverse/assert-manual-workflows.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865"

      - name: Build native dependencies
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/
          tag=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          gh release download "$tag"             --repo 2dust/AndroidLibXrayLite             --pattern libv2ray.aar             --dir V2rayNG/app/libs/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test overlay and compile arm64 APK
        working-directory: V2rayNG
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testFdroidReverseDebugUnitTest             --tests com.v2ray.ang.feature.reverse.VlessReverseConfigOverlayTest             --tests com.v2ray.ang.feature.reverse.PrivateRouteCapturePolicyTest             :app:assembleFdroidReverseDebug             -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Push validated sync branch and open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: adapt Reverse to upstream $UPSTREAM_REF"
          fi
          git push --set-upstream origin "$SYNC_BRANCH"
          gh pr create             --base reverse-next             --head "$SYNC_BRANCH"             --draft             --title "Sync Reverse with upstream $UPSTREAM_REF"             --body "Upstream merge completed. Reverse contract tests passed and an arm64 Debug APK compiled successfully. Workflows remain manual-only."
