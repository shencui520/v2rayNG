name: Build VLESS Reverse arm64 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: reverse-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Assert manual-only workflows
        run: bash scripts/reverse/assert-manual-workflows.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;29.0.14206865"

      - name: Build required native libraries
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Determine Xray library version
        run: echo "XRAY_LIB_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Download Xray Android library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.XRAY_LIB_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Run Reverse contract tests
        working-directory: V2rayNG
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:testFdroidReverseDebugUnitTest \
            --tests com.v2ray.ang.feature.reverse.VlessReverseConfigOverlayTest \
            --tests com.v2ray.ang.feature.reverse.PrivateRouteCapturePolicyTest \
            -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Build arm64 Debug APK
        if: inputs.build_type == 'debug'
        working-directory: V2rayNG
        run: ./gradlew :app:assembleFdroidReverseDebug -PABI_FILTERS=arm64-v8a --stacktrace

      - name: Validate Reverse release signing secrets
        if: inputs.build_type == 'release'
        env:
          KEYSTORE: ${{ secrets.REVERSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REVERSE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Build signed arm64 Release APK
        if: inputs.build_type == 'release'
        working-directory: V2rayNG
        env:
          KEYSTORE: ${{ secrets.REVERSE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REVERSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REVERSE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > reverse-release.jks
          ./gradlew :app:assembleFdroidReverseRelease \
            -PABI_FILTERS=arm64-v8a \
            -Pandroid.injected.signing.store.file="$PWD/reverse-release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-Reverse-arm64-${{ inputs.build_type }}
          path: V2rayNG/app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
